<style>
:root{--bg:#f7f7f6;--card:#fff;--text:#161616;--sub:#6a6a6a;--line:#e1e1df;--ink:#161616;--inkT:#fff;--acc:#3f33c8;
--c0:#f1e7c4;--c1:#efd3cf;--c2:#cfdfe9;--c3:#d3e2cd;--c4:#dbd4e9;--cT:#161616}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--text:#ececec;--sub:#9a9a9a;--line:#2e2e2e;--ink:#ececec;--inkT:#121212;--acc:#a39cff;
--c0:#3a3522;--c1:#3d2a28;--c2:#243541;--c3:#2a3a28;--c4:#322d44;--cT:#ececec}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:21px;letter-spacing:-.04em;padding:0}
.me{display:flex;align-items:center;gap:10px;font-size:14px}
.me img{width:28px;height:28px;border-radius:50%}
.btn{background:var(--ink);color:var(--inkT);padding:10px 18px;border-radius:8px;font-weight:700;font-size:15px}
.btn:disabled{opacity:.45}
.link{color:var(--sub);padding:4px 2px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
main{max-width:980px;margin:0 auto;padding:36px 20px 120px}
h1{font-weight:900;font-size:clamp(26px,5.5vw,38px);letter-spacing:-.04em;line-height:1.25;margin:0 0 8px}
.sub{color:var(--sub);margin:0 0 28px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
textarea{min-height:110px;resize:vertical;margin-bottom:10px}
.new{display:flex;gap:8px;margin-bottom:34px;flex-wrap:wrap;align-items:center}
.new input{flex:1;min-width:180px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.room{display:flex;flex-direction:column;justify-content:space-between;gap:24px;text-align:left;color:var(--cT);border-radius:10px;padding:18px;min-height:120px;width:100%}
.room b{font-weight:700;font-size:18px;line-height:1.4;letter-spacing:-.02em;word-break:break-word}
.room small{font-size:13px;opacity:.65}
.sec{font-weight:700;font-size:15px;color:var(--sub);margin:34px 0 12px}
.dots{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.dot.on{border-color:var(--text)}
.dots .btn{margin-left:auto}
.wall{columns:230px;column-gap:12px}
.note{break-inside:avoid;margin-bottom:12px;border-radius:10px;padding:16px;color:var(--cT)}
.note p{margin:0 0 14px;white-space:pre-wrap;word-break:break-word}
.note img,.note video{display:block;width:100%;border-radius:6px;margin-bottom:12px;background:rgba(0,0,0,.08)}
.note img{cursor:zoom-in}
.meta{display:flex;align-items:center;gap:8px;font-size:13px}
.meta img{width:20px;height:20px;border-radius:50%;margin:0}
.meta .who{flex:1;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.like{font-size:13px;padding:2px 9px;border-radius:6px;border:1px solid currentColor;opacity:.75}
.like.on{background:var(--cT);color:var(--bg);border-color:var(--cT);opacity:1}

.tog{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;user-select:none}

.togHint{width:100%;color:var(--sub);font-size:13px;margin-top:-2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 22px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;font-size:14px;font-weight:500}

.pitem .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:2px 7px;font-size:12px;opacity:1;text-decoration:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.note .mgrid img{aspect-ratio:1;object-fit:cover;margin:0}

.note .cmedia{display:block;width:auto;max-width:100%;max-height:200px;margin:6px 0 0;border-radius:6px}

@media (prefers-reduced-motion:no-preference){.fab:active{transform:scale(.95)}.tog .track::after{transition:transform .15s}}
</style>

<body>
<header>
  <button class="logo" id="home">토크룸</button>
  <div class="me" id="me"></div>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, deleteDoc, updateDoc, getDocs, getDoc, setDoc, onSnapshot, query, orderBy, serverTimestamp, where, arrayUnion, arrayRemove, writeBatch, increment, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ▼▼▼ Firebase 콘솔의 firebaseConfig 값을 여기에 붙여넣으세요 ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyBl3blEXyNM_2aYd_chGkduFNn152P1upI",
  authDomain: "talk-room-de31d.firebaseapp.com",
  projectId: "talk-room-de31d",
  storageBucket: "talk-room-de31d.firebasestorage.app",
  messagingSenderId: "432518377686",
  appId: "1:432518377686:web:b8dc5670e7b05a45b79977"
};
// ▲▲▲ -----------------------------------------------------

// ▼ 사진/동영상 업로드용 Cloudinary 설정 (무료, 카드 불필요). 비워두면 사진만(자동 압축) 가능, 동영상은 불가
const CLOUDINARY = { cloudName: "gsumifqd", uploadPreset: "Talkroom" };
const cloudOn = !!(CLOUDINARY.cloudName && CLOUDINARY.uploadPreset);

const app = document.getElementById('app'), meBox = document.getElementById('me');
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
let unsubs = [], user = null, color = 0, token = 0, db, auth;

if (!firebaseConfig.apiKey) {
  const s = el('div', 'setup');
  s.append(el('h1', null, '설정이 필요해요'), el('p', 'sub', 'index.html 안의 firebaseConfig에 Firebase 콘솔의 값을 붙여넣어 주세요.'));
  app.append(s);
} else {
  const fb = initializeApp(firebaseConfig);
  auth = getAuth(fb); db = getFirestore(fb);
  getRedirectResult(auth).catch(e => alert('로그인 실패\n오류 코드: ' + e.code + '\n' + e.message));
  onAuthStateChanged(auth, u => { user = u; renderMe(); route(); });
  window.addEventListener('hashchange', route);
}

function renderMe() {
  meBox.textContent = '';
  if (user) {
    if (user.photoURL) { const i = el('img'); i.src = user.photoURL; i.alt = ''; i.referrerPolicy = 'no-referrer'; meBox.append(i); }
    const o = el('button', 'link', '로그아웃'); o.onclick = () => signOut(auth); meBox.append(o);
  } else {
    const b = el('button', 'btn', 'Google로 로그인'); b.onclick = login; meBox.append(b);
  }
}
function login() {
  const prov = new GoogleAuthProvider();
  signInWithPopup(auth, prov).catch(e => {
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
    if (e.code === 'auth/popup-blocked') return signInWithRedirect(auth, prov);
    alert('로그인 실패\n오류 코드: ' + e.code + '\n' + e.message);
  });
}
let cmUnsubs = [], openSet = new Set(), drafts = {}, pickers = {}, sending = new Set(), focusPost = null;
function stopComments() { cmUnsubs.forEach(f => f()); cmUnsubs = []; }
function reset() { token++; unsubs.forEach(f => f()); unsubs = []; stopComments(); openSet = new Set(); drafts = {}; pickers = {}; app.textContent = ''; }
document.getElementById('home').onclick = () => { location.hash = ''; };
function route() { const id = location.hash.slice(1); id ? roomView(id) : homeView(); }

const tm = r => (r.createdAt && r.createdAt.toMillis) ? r.createdAt.toMillis() : Date.now();
function roomCard(id, r, i) {
  const b = el('button', 'room'); b.style.background = `var(--c${i % 5})`;
  b.append(el('b', null, r.title), el('small', null, (r.listed === true ? '' : '비공개 · ') + (r.ownerName || '')));
  b.onclick = () => { location.hash = '#' + id; }; return b;
}
function fillRooms(box, docs, emptyMsg) {
  box.textContent = '';
  if (!docs.length) { box.style.display = 'block'; box.append(el('div', 'empty', emptyMsg)); return; }
  box.style.display = '';
  docs.forEach((d, i) => box.append(roomCard(d.id, d.data(), i)));
}

function homeView() {
  reset(); document.title = '토크룸';
  app.append(el('h1', null, '주제 하나 정해서 방 파세요'), el('p', 'sub', '링크만 보내면 누구든 들어와서 글을 남길 수 있어요.'));
  if (user) {
    const f = el('div', 'new'), t = el('input');
    t.placeholder = '방 주제 (예: 올해 제일 재밌게 한 게임)'; t.maxLength = 60;
    const b = el('button', 'btn', '방 파기');
    const lab = el('label', 'tog'), cb = el('input'), hint = el('small', 'togHint', ''); cb.type = 'checkbox';
    lab.append(cb, el('span', 'track'), el('span', null, '비공개'));
    cb.onchange = () => { hint.textContent = cb.checked ? '목록에는 안 뜨고, 링크 아는 사람만 들어와요.' : ''; };
    b.onclick = async () => {
      const v = t.value.trim(); if (!v) return; b.disabled = true;
      try { const r = await addDoc(collection(db, 'rooms'), { title: v, ownerId: user.uid, ownerName: user.displayName || '익명', listed: !cb.checked, createdAt: serverTimestamp() }); location.hash = '#' + r.id; }
      catch (e) { b.disabled = false; alert('방을 만들지 못했어요. Firestore 보안 규칙을 확인해 주세요.'); }
    };
    f.append(t, b, lab, hint); app.append(f);
  } else app.append(el('div', 'hint', '글을 쓰려면 로그인이 필요해요. 구경은 로그인 없이도 돼요.'));

  const mineHead = el('h2', 'sec', '내 비공개 방'), mine = el('div', 'rooms');
  mineHead.hidden = true; mine.hidden = true; app.append(mineHead, mine);
  app.append(el('h2', 'sec', '열려 있는 방'));
  const list = el('div', 'rooms'); app.append(list);

  unsubs.push(onSnapshot(query(collection(db, 'rooms'), where('listed', '==', true)), s => {
    const d = s.docs.slice().sort((a, b) => tm(b.data()) - tm(a.data()));
    fillRooms(list, d, '아직 방이 없어요. 하나 파보세요.');
  }, () => { list.textContent = '방 목록을 불러오지 못했어요.'; }));

  if (user) unsubs.push(onSnapshot(query(collection(db, 'rooms'), where('ownerId', '==', user.uid)), s => {
    const d = s.docs.filter(x => x.data().listed !== true).sort((a, b) => tm(b.data()) - tm(a.data()));
    mineHead.hidden = mine.hidden = !d.length; if (d.length) fillRooms(mine, d, '');
  }, () => {}));
}

function showQR(url, title) {
  if (typeof qrcode !== 'function') { alert('QR 코드를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const n = q.getModuleCount(), m = 4, size = n + 2 * m; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', title + ' 입장 QR 코드');
  const bg = document.createElementNS(ns, 'rect'); bg.setAttribute('width', size); bg.setAttribute('height', size); bg.setAttribute('fill', '#fff');
  const path = document.createElementNS(ns, 'path'); path.setAttribute('d', d); path.setAttribute('fill', '#000'); path.setAttribute('shape-rendering', 'crispEdges');
  svg.append(bg, path);
  const ov = el('div', 'ov'), box = el('div', 'qrbox'), close = el('button', 'btn', '닫기');
  close.onclick = () => ov.remove(); ov.onclick = e => { if (e.target === ov) ov.remove(); };
  box.append(el('b', null, title), svg, el('small', null, url), close); ov.append(box); document.body.append(ov);
}
async function shareRoom(title, btn) {
  const url = location.href;
  if (navigator.share) { try { await navigator.share({ title, text: title + ' · 토크룸', url }); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(url); btn.textContent = '링크를 복사했어요'; } catch (e) { prompt('링크를 복사하세요', url); }
}

const loadImg = f => new Promise((ok, no) => { const u = URL.createObjectURL(f), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => no(new Error('이 사진 형식은 올릴 수 없어요. JPG나 PNG로 시도해 주세요.')); i.src = u; });
async function shrink(f, max, q) {
  const i = await loadImg(f), r = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas');
  c.width = Math.round(i.width * r); c.height = Math.round(i.height * r); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
}
const toData = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
async function cloudUpload(file, kind) {
  const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', CLOUDINARY.uploadPreset);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/${kind}/upload`, { method: 'POST', body: fd });
  const j = await r.json(); if (!r.ok || !j.secure_url) throw new Error('파일 업로드에 실패했어요. Cloudinary 설정을 확인해 주세요.');
  return j.secure_url;
}
async function uploadMedia(file, budget) {
  if (file.type.startsWith('video/')) return { type: 'video', url: await cloudUpload(file, 'video') };
  if (cloudOn) return { type: 'image', url: await cloudUpload(await shrink(file, 1600, .85), 'image') };
  for (const [max, q] of [[900, .72], [700, .65], [500, .6], [400, .5], [300, .45]]) { const d = await toData(await shrink(file, max, q)); if (d.length < (budget || 650000)) return { type: 'image', url: d }; }
  throw new Error('사진이 너무 커요. 더 작은 사진을 골라주세요.');
}
function lightbox(url) {
  const ov = el('div', 'ov lb'), i = el('img'); i.src = url; i.alt = '확대한 사진'; ov.append(i); ov.onclick = () => ov.remove(); document.body.append(ov);
}

async function removePost(ref) {
  const cs = await getDocs(collection(ref, 'comments'));
  await Promise.all(cs.docs.map(c => deleteDoc(c.ref)));
  await deleteDoc(ref);
}
const validUrl = u => typeof u === 'string' && /^(https:\/\/|data:image\/)/.test(u);
const postMedias = p => (Array.isArray(p.medias) ? p.medias : (p.media ? [p.media] : [])).filter(m => m && validUrl(m.url));
function mediaEl(m, cls) {
  let e;
  if (m.type === 'video') { e = el('video'); e.controls = true; e.playsInline = true; e.preload = 'metadata'; }
  else { e = el('img'); e.loading = 'lazy'; e.alt = '첨부 사진'; e.onclick = () => lightbox(m.url); }
  if (cls) e.className = cls; e.src = m.url; return e;
}
function mediaPicker(max, initial) {
  const items = (initial || []).map(m => ({ type: m.type, url: m.url }));
  const grid = el('div', 'pgrid'), btn = el('button', 'pill', ''), pick = el('input'), ctl = el('span');
  pick.type = 'file'; pick.accept = cloudOn ? 'image/*,video/*' : 'image/*'; pick.multiple = max > 1; pick.hidden = true;
  ctl.append(btn, pick);
  const base = cloudOn ? '사진 · 동영상' : '사진';
  const draw = () => {
    grid.textContent = ''; grid.hidden = !items.length;
    items.forEach((it, i) => {
      const c = el('div', 'pitem'), m = el(it.type === 'video' ? 'video' : 'img');
      m.src = it.preview || it.url;
      if (it.type === 'video') { m.muted = true; m.preload = 'metadata'; } else m.alt = '선택한 사진';
      const rm = el('button', 'x', '삭제'); rm.onclick = () => { if (it.preview) URL.revokeObjectURL(it.preview); items.splice(i, 1); draw(); };
      c.append(m, rm); grid.append(c);
    });
    btn.textContent = max > 1 ? base + ' ' + items.length + '/' + max : base;
    btn.disabled = items.length >= max;
  };
  btn.onclick = () => pick.click();
  pick.onchange = () => {
    for (const f of [...pick.files]) {
      const isV = f.type.startsWith('video/'), isI = f.type.startsWith('image/');
      if (!isV && !isI) { alert('사진이나 동영상만 올릴 수 있어요.'); continue; }
      if (isV && !cloudOn) { alert('동영상은 지금 올릴 수 없어요.'); continue; }
      if (isV && f.size > 50 * 1024 * 1024) { alert('동영상은 50MB 이하만 올릴 수 있어요.'); continue; }
      if (isI && f.size > 15 * 1024 * 1024) { alert('사진은 15MB 이하만 올릴 수 있어요.'); continue; }
      if (isV && items.some(x => x.type === 'video')) { alert('동영상은 1개만 올릴 수 있어요.'); continue; }
      if (items.length >= max) { alert('최대 ' + max + '개까지 올릴 수 있어요.'); break; }
      items.push({ type: isV ? 'video' : 'image', file: f, preview: URL.createObjectURL(f) });
    }
    pick.value = ''; draw();
  };
  draw();
  return {
    ctl, grid, items,
    clear() { items.forEach(i => i.preview && URL.revokeObjectURL(i.preview)); items.length = 0; draw(); },
    upload() { return Promise.all(items.map(it => it.file ? uploadMedia(it.file, Math.floor(650000 / max)) : { type: it.type, url: it.url })); }
  };
}

function openEdit(ref, p) {
  const ov = el('div', 'ov sheetov'), box = el('div', 'sheet');
  const head = el('div', 'sheethead'), x = el('button', 'x', '닫기'); x.onclick = () => ov.remove();
  head.append(el('b', null, '글 수정'), x);
  const ta = el('textarea'); ta.maxLength = 300; ta.value = p.text || '';
  const orig = postMedias(p), pk = mediaPicker(4, orig);
  const save = el('button', 'btn', '저장');
  save.onclick = async () => {
    const v = ta.value.trim(); if (!v && !pk.items.length) return;
    const changed = pk.items.some(i => i.file) || pk.items.length !== orig.length || pk.items.some((it, i) => it.url !== orig[i].url);
    if (v === (p.text || '') && !changed) { ov.remove(); return; }
    save.disabled = true; save.textContent = '저장 중…';
    try {
      const med = await pk.upload(), upd = { text: v, edited: true };
      if (changed || Array.isArray(p.medias)) upd.medias = med;
      if (p.media && changed) upd.media = deleteField();
      await updateDoc(ref, upd); ov.remove();
    } catch (e) { save.disabled = false; save.textContent = '저장'; alert(e && e.code ? '수정하지 못했어요. 잠시 후 다시 시도해 주세요.' : (e && e.message) || '수정하지 못했어요.'); }
  };
  const row = el('div', 'dots'); row.append(pk.ctl, save);
  box.append(head, ta, pk.grid, row); ov.append(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.append(ov); ta.focus();
}

function openCompose(id) {
  const ov = el('div', 'ov sheetov'), box = el('div', 'sheet');
  const head = el('div', 'sheethead'), x = el('button', 'x', '닫기'); x.onclick = () => ov.remove();
  head.append(el('b', null, '글쓰기'), x);
  const ta = el('textarea'); ta.placeholder = '하고 싶은 말'; ta.maxLength = 300;
  const pk = mediaPicker(4, []), rowa = el('div', 'rowa'); rowa.append(pk.ctl);
  const dots = el('div', 'dots');
  for (let i = 0; i < 5; i++) {
    const dd = el('button', 'dot' + (i === color ? ' on' : '')); dd.style.background = `var(--c${i})`; dd.setAttribute('aria-label', '카드 색상 ' + (i + 1));
    dd.onclick = () => { color = i; [...dots.children].forEach((y, j) => { if (j < 5) y.classList.toggle('on', j === i); }); }; dots.append(dd);
  }
  const send = el('button', 'btn', '올리기');
  send.onclick = async () => {
    const v = ta.value.trim(); if (!v && !pk.items.length) return;
    send.disabled = true; send.textContent = '올리는 중…';
    try {
      const data = { text: v, color, uid: user.uid, name: user.displayName || '익명', photo: user.photoURL || '', likes: [], createdAt: serverTimestamp() };
      if (pk.items.length) data.medias = await pk.upload();
      await addDoc(collection(db, 'rooms', id, 'posts'), data); ov.remove();
    } catch (e) { send.disabled = false; send.textContent = '올리기'; alert(e && e.code ? '올리지 못했어요. 잠시 후 다시 시도해 주세요.' : (e && e.message) || '올리지 못했어요.'); }
  };
  dots.append(send); box.append(head, ta, pk.grid, rowa, dots); ov.append(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.append(ov); ta.focus();
}

async function deleteRoom(id) {
  if (!confirm('이 방과 모든 의견을 삭제할까요?')) return false;
  try {
    const ps = await getDocs(collection(db, 'rooms', id, 'posts')); await Promise.all(ps.docs.map(p => removePost(p.ref)));
    await deleteDoc(doc(db, 'rooms', id)); location.hash = ''; return true;
  } catch (e) { alert('삭제하지 못했어요.'); return false; }
}
function openRoomSettings(id, r) {
  const ov = el('div', 'ov sheetov'), box = el('div', 'sheet');
  const head = el('div', 'sheethead'), x = el('button', 'x', '닫기'); x.onclick = () => ov.remove();
  head.append(el('b', null, '방 설정'), x);
  const t = el('input'); t.value = r.title; t.maxLength = 60; t.setAttribute('aria-label', '방 이름');
  const lab = el('label', 'tog'), cb = el('input'), hint = el('small', 'togHint', ''); cb.type = 'checkbox'; cb.checked = r.listed !== true;
  lab.append(cb, el('span', 'track'), el('span', null, '비공개'));
  const sync = () => { hint.textContent = cb.checked ? '목록에는 안 뜨고, 링크 아는 사람만 들어와요.' : '누구나 방 목록에서 볼 수 있어요.'; };
  cb.onchange = sync; sync();
  const save = el('button', 'btn', '저장');
  save.onclick = async () => {
    const v = t.value.trim(); if (!v) return;
    const upd = {}; if (v !== r.title) upd.title = v; if (!cb.checked !== (r.listed === true)) upd.listed = !cb.checked;
    if (!Object.keys(upd).length) { ov.remove(); return; }
    save.disabled = true;
    try { await updateDoc(doc(db, 'rooms', id), upd); ov.remove(); }
    catch (e) { save.disabled = false; alert('저장하지 못했어요. 잠시 후 다시 시도해 주세요.'); }
  };
  const row = el('div', 'dots'), del = el('button', 'x', '방 삭제');
  del.onclick = async () => { if (await deleteRoom(id)) ov.remove(); };
  row.append(del, save);
  box.append(head, t, lab, hint, row); ov.append(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.append(ov);
}

function roomView(id) {
  reset();
  const back = el('button', 'link', '방 목록으로'); back.onclick = () => { location.hash = ''; };
  const h = el('h1', null, ''), sub = el('p', 'sub', '');
  app.append(back, h, sub);
  let room = null;
  const bar = el('div', 'bar');
  const sh = el('button', 'pill', '공유'), qr = el('button', 'pill', 'QR'), cp = el('button', 'pill', '링크 복사');
  sh.onclick = () => shareRoom(room ? room.title : '토크룸', sh);
  qr.onclick = () => showQR(location.href, room ? room.title : '토크룸');
  cp.onclick = async () => { try { await navigator.clipboard.writeText(location.href); cp.textContent = '복사했어요'; } catch (e) { prompt('링크를 복사하세요', location.href); } };
  bar.append(sh, qr, cp); app.append(bar);

  const fab = el('button', 'fab', '+'); fab.setAttribute('aria-label', '글쓰기');
  fab.onclick = () => { if (!user) { login(); return; } openCompose(id); };
  app.append(fab);
  const wall = el('div', 'wall'); app.append(wall);

  unsubs.push(onSnapshot(doc(db, 'rooms', id), s => {
    if (!s.exists()) { room = null; h.textContent = '없는 방이에요'; sub.textContent = '삭제됐거나 주소가 잘못됐어요.'; return; }
    room = s.data(); h.textContent = room.title;
    sub.textContent = (room.listed === true ? '' : '비공개 방 · 링크 아는 사람만 입장 · ') + '만든 사람 ' + (room.ownerName || '익명');
    document.title = room.title + ' · 토크룸';
    if (user && user.uid === room.ownerId && !bar.querySelector('.del')) {
      const d = el('button', 'pill del', '방 설정'); d.onclick = () => openRoomSettings(id, room); bar.append(d);
    }
  }));
  unsubs.push(onSnapshot(query(collection(db, 'rooms', id, 'posts'), orderBy('createdAt', 'desc')), s => {
    stopComments(); wall.textContent = ''; let pendingFocus = null;
    if (s.empty) { wall.style.columns = 'auto'; wall.append(el('div', 'empty', '첫 글을 남겨보세요.')); return; }
    wall.style.columns = '';
    s.docs.forEach(d => {
      const p = d.data(), n = el('div', 'note'); n.style.background = `var(--c${(p.color | 0) % 5})`;
      const ml = postMedias(p);
      if (ml.length) { const mb = el('div', ml.length > 1 ? 'mgrid' : ''); ml.forEach(m => mb.append(mediaEl(m))); n.append(mb); }
      if (p.text) n.append(el('p', null, p.text));
      const m = el('div', 'meta');
      if (p.photo) { const i = el('img'); i.src = p.photo; i.alt = ''; i.referrerPolicy = 'no-referrer'; m.append(i); }
      m.append(el('span', 'who', (p.name || '익명') + (p.edited ? ' · 수정됨' : '')));
      const likes = p.likes || [], liked = user && likes.includes(user.uid);
      const lb = el('button', 'like' + (liked ? ' on' : ''), '좋아요 ' + likes.length);
      lb.setAttribute('aria-label', '좋아요');
      lb.onclick = () => { if (!user) return login(); updateDoc(d.ref, { likes: liked ? arrayRemove(user.uid) : arrayUnion(user.uid) }); };
      m.append(lb);
      if (user && (user.uid === p.uid || (room && user.uid === room.ownerId))) {
        const x = el('button', 'x', '삭제'); x.setAttribute('aria-label', '글 삭제');
        x.onclick = async () => { if (!confirm('이 의견을 삭제할까요?')) return; try { await removePost(d.ref); } catch (e) { alert('삭제하지 못했어요.'); } }; m.append(x);
      }
      n.append(m);
      const acts = el('div', 'acts'), cbtn = el('button', 'x', '댓글' + (p.cc > 0 ? ' ' + p.cc : ''));
      acts.append(cbtn);
      if (user && user.uid === p.uid) { const eb = el('button', 'x', '수정'); eb.onclick = () => openEdit(d.ref, p); acts.append(eb); }
      const cbox = el('div', 'cbox'), clist = el('div'); cbox.hidden = true; cbox.append(clist);
      if (user) {
        const cp = pickers[d.id] || (pickers[d.id] = mediaPicker(1, []));
        const form = el('div', 'cform'), ci = el('input'), cs = el('button', 'btn', '등록');
        ci.placeholder = '댓글 쓰기'; ci.maxLength = 200; ci.value = drafts[d.id] || ''; ci.oninput = () => { drafts[d.id] = ci.value; };
        const send = async () => {
          if (sending.has(d.id)) return;
          const v = ci.value.trim(); if (!v && !cp.items.length) return;
          sending.add(d.id); cs.disabled = true;
          drafts[d.id] = ''; ci.value = ''; focusPost = d.id; setTimeout(() => { if (focusPost === d.id) focusPost = null; }, 2500);
          try {
            const med = cp.items.length ? await cp.upload() : [];
            const data = { text: v, uid: user.uid, name: user.displayName || '익명', photo: user.photoURL || '', createdAt: serverTimestamp() };
            if (med.length) data.media = med[0];
            const b = writeBatch(db);
            b.set(doc(collection(d.ref, 'comments')), data);
            b.update(d.ref, { cc: increment(1) });
            await b.commit(); cp.clear();
          } catch (e) { drafts[d.id] = v; ci.value = v; alert(e && e.code ? '댓글을 달지 못했어요.' : (e && e.message) || '댓글을 달지 못했어요.'); }
          sending.delete(d.id); cs.disabled = false;
        };
        cs.onclick = send;
        ci.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) send(); };
        form.append(ci, cp.ctl, cs); cbox.append(form, cp.grid);
        if (focusPost === d.id && openSet.has(d.id)) pendingFocus = ci;
      } else {
        const l = el('button', 'x', '로그인하면 댓글을 쓸 수 있어요'); l.onclick = login; cbox.append(l);
      }
      let un = null;
      const openC = () => {
        cbox.hidden = false; openSet.add(d.id);
        un = onSnapshot(query(collection(d.ref, 'comments'), orderBy('createdAt', 'asc')), cs => {
          clist.textContent = '';
          if (cs.empty) clist.append(el('div', 'cnote', '아직 댓글이 없어요.'));
          cs.docs.forEach(c => {
            const cd = c.data(), row = el('div', 'cm');
            row.append(el('b', null, cd.name || '익명'), document.createTextNode(cd.text || ''));
            if (user && (user.uid === cd.uid || user.uid === p.uid || (room && user.uid === room.ownerId))) {
              const del = el('button', 'x', '삭제');
              del.onclick = async () => {
                if (!confirm('이 댓글을 삭제할까요?')) return;
                try { const b = writeBatch(db); b.delete(c.ref); if (p.cc > 0) b.update(d.ref, { cc: increment(-1) }); await b.commit(); }
                catch (e) { alert('삭제하지 못했어요.'); }
              };
              row.append(del);
            }
            if (cd.media && validUrl(cd.media.url)) { const mw = el('div'); mw.append(mediaEl(cd.media, 'cmedia')); row.append(mw); }
            clist.append(row);
          });
        }, () => { clist.textContent = '댓글을 불러오지 못했어요.'; });
        cmUnsubs.push(() => { if (un) un(); });
      };
      const closeC = () => { cbox.hidden = true; openSet.delete(d.id); if (un) { un(); un = null; } };
      cbtn.onclick = () => { if (cbox.hidden) openC(); else closeC(); };
      if (openSet.has(d.id)) openC();
      n.append(acts, cbox); wall.append(n);
    });
    if (pendingFocus) pendingFocus.focus({ preventScroll: true });
  }, () => { wall.textContent = '의견을 불러오지 못했어요.'; }));
}
</script>
</body>
