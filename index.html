<style>
:root{--bg:#f1f0fb;--card:#fff;--text:#1d1b2e;--sub:#6e6b85;--line:#dedcf0;--acc:#4338ca;--accT:#fff;
--c0:#fff2a8;--c1:#ffc9d4;--c2:#bfe6ff;--c3:#c8f2c2;--c4:#e0cffb;--cT:#1d1b2e}
@media (prefers-color-scheme:dark){:root{--bg:#14131f;--card:#201e30;--text:#eeecfa;--sub:#9d9ab8;--line:#34314a;--acc:#a5a0ff;--accT:#14131f;
--c0:#4d4619;--c1:#552a39;--c2:#1c3d56;--c3:#24472a;--c4:#41306a;--cT:#f3f1fb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-family:Jua,sans-serif;font-size:26px;color:var(--acc);background:none;padding:0}
.me{display:flex;align-items:center;gap:8px;font-size:14px}
.me img{width:30px;height:30px;border-radius:50%}
.btn{background:var(--acc);color:var(--accT);padding:10px 16px;border-radius:999px;font-weight:700}
.btn:disabled{opacity:.5}
.link{background:none;color:var(--sub);padding:4px 6px;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 110px}
h1{font-family:Jua,sans-serif;font-weight:400;font-size:clamp(28px,6vw,40px);margin:8px 0 6px;line-height:1.2}
.sub{color:var(--sub);margin:0 0 20px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{min-height:90px;resize:vertical;margin-bottom:10px}
.new{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.new input{flex:1;min-width:170px}
.chk{display:flex;gap:8px;align-items:center;width:100%;font-size:14px;color:var(--sub);cursor:pointer}.chk input{width:auto;margin:0;accent-color:var(--acc)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.pill{background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700}
.sec{font-family:Jua,sans-serif;font-size:20px;margin:26px 0 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.qrbox{background:var(--card);border-radius:22px;padding:20px;text-align:center;max-width:320px;width:100%}
.qrbox svg{display:block;width:100%;max-width:260px;margin:12px auto;border-radius:12px}
.qrbox small{display:block;word-break:break-all;color:var(--sub);margin-bottom:12px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.room{text-align:left;color:var(--cT);border-radius:20px;padding:20px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.room b{font-family:Jua,sans-serif;font-weight:400;font-size:22px;line-height:1.3;word-break:break-word}
.room small{opacity:.7}
.compose{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:22px}
.dots{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.dot.on{border-color:var(--text)}
.dots .btn{margin-left:auto}
.wall{columns:220px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;border-radius:18px;padding:16px;color:var(--cT)}
.note p{margin:0 0 12px;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;align-items:center;gap:6px;font-size:13px}
.meta img{width:22px;height:22px;border-radius:50%}
.meta .who{flex:1;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.like{background:rgba(255,255,255,.55);color:#1d1b2e;border-radius:999px;padding:4px 10px;font-size:13px}
.like.on{background:#1d1b2e;color:#fff}
@media (prefers-color-scheme:dark){.like{background:rgba(0,0,0,.3);color:#fff}.like.on{background:#fff;color:#1d1b2e}}
.x{background:none;color:inherit;opacity:.6;padding:2px 6px}
.empty,.hint{color:var(--sub);text-align:center;padding:30px 0}
.hint{background:var(--card);border:2px dashed var(--line);border-radius:18px;margin-bottom:22px;padding:20px}
.setup{max-width:520px;margin:60px auto;padding:20px}
@media (prefers-reduced-motion:no-preference){.like,.btn,.room{transition:transform .15s}.room:hover{transform:translateY(-3px)}}

.tog{display:flex;align-items:center;gap:10px;width:100%;font-size:15px;cursor:pointer;user-select:none}
.tog input{position:absolute;opacity:0;width:0;height:0;min-width:0;padding:0;border:0;margin:0}
.track{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none}
.track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog input:checked+.track{background:var(--acc)}
.tog input:checked+.track::after{transform:translateX(18px)}
.tog input:focus-visible+.track{outline:3px solid var(--acc);outline-offset:2px}
.togHint{width:100%;color:var(--sub);font-size:13px;margin-top:-4px}
.preview{position:relative;margin-bottom:10px}
.preview img,.preview video{display:block;max-width:100%;max-height:190px;border-radius:12px}
.preview .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:28px;height:28px;opacity:1;padding:0}
.rowa{display:flex;gap:8px;align-items:center;margin-bottom:10px}.rowa small{color:var(--sub)}
.note img,.note video{display:block;width:100%;border-radius:12px;margin-bottom:10px;background:rgba(0,0,0,.08)}
.note img{cursor:zoom-in}
.lb img{max-width:100%;max-height:90vh;border-radius:10px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:var(--acc);color:var(--accT);font-size:34px;line-height:1;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:10}
.sheetov{align-items:flex-end;padding:0}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:17px}
@media (prefers-reduced-motion:no-preference){.fab:active{transform:scale(.94)}.tog .track::after{transition:transform .15s}}
</style>
</head>
<body>
<header>
  <button class="logo" id="home">토크룸</button>
  <div class="me" id="me"></div>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, deleteDoc, updateDoc, getDocs, getDoc, setDoc, onSnapshot, query, orderBy, serverTimestamp, where, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ▼▼▼ Firebase 콘솔의 firebaseConfig 값을 여기에 붙여넣으세요 ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyBl3blEXyNM_2aYd_chGkduFNn152P1upI",
  authDomain: "talk-room-de31d.firebaseapp.com",
  projectId: "talk-room-de31d",
  storageBucket: "talk-room-de31d.firebasestorage.app",
  messagingSenderId: "432518377686",
  appId: "1:432518377686:web:b8dc5670e7b05a45b79977"
};
// ▲▲▲ -----------------------------------------------------

// ▼ 사진/동영상 업로드용 Cloudinary 설정 (무료, 카드 불필요). 비워두면 사진만(자동 압축) 가능, 동영상은 불가
const CLOUDINARY = { cloudName: "", uploadPreset: "" };
const cloudOn = !!(CLOUDINARY.cloudName && CLOUDINARY.uploadPreset);

const app = document.getElementById('app'), meBox = document.getElementById('me');
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
let unsubs = [], user = null, color = 0, token = 0, db, auth;

if (!firebaseConfig.apiKey) {
  const s = el('div', 'setup');
  s.append(el('h1', null, '설정이 필요해요'), el('p', 'sub', 'index.html 안의 firebaseConfig에 Firebase 콘솔의 값을 붙여넣어 주세요.'));
  app.append(s);
} else {
  const fb = initializeApp(firebaseConfig);
  auth = getAuth(fb); db = getFirestore(fb);
  getRedirectResult(auth).catch(e => alert('로그인 실패\n오류 코드: ' + e.code + '\n' + e.message));
  onAuthStateChanged(auth, u => { user = u; renderMe(); route(); });
  window.addEventListener('hashchange', route);
}

function renderMe() {
  meBox.textContent = '';
  if (user) {
    if (user.photoURL) { const i = el('img'); i.src = user.photoURL; i.alt = ''; i.referrerPolicy = 'no-referrer'; meBox.append(i); }
    const o = el('button', 'link', '로그아웃'); o.onclick = () => signOut(auth); meBox.append(o);
  } else {
    const b = el('button', 'btn', 'Google로 로그인'); b.onclick = login; meBox.append(b);
  }
}
function login() {
  const prov = new GoogleAuthProvider();
  signInWithPopup(auth, prov).catch(e => {
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
    if (e.code === 'auth/popup-blocked') return signInWithRedirect(auth, prov);
    alert('로그인 실패\n오류 코드: ' + e.code + '\n' + e.message);
  });
}
function reset() { token++; unsubs.forEach(f => f()); unsubs = []; app.textContent = ''; }
document.getElementById('home').onclick = () => { location.hash = ''; };
function route() { const id = location.hash.slice(1); id ? roomView(id) : homeView(); }

const tm = r => (r.createdAt && r.createdAt.toMillis) ? r.createdAt.toMillis() : Date.now();
function roomCard(id, r, i) {
  const b = el('button', 'room'); b.style.background = `var(--c${i % 5})`;
  b.append(el('b', null, (r.listed === true ? '' : '🔒 ') + r.title), el('small', null, r.ownerName || ''));
  b.onclick = () => { location.hash = '#' + id; }; return b;
}
function fillRooms(box, docs, emptyMsg) {
  box.textContent = '';
  if (!docs.length) { box.style.display = 'block'; box.append(el('div', 'empty', emptyMsg)); return; }
  box.style.display = '';
  docs.forEach((d, i) => box.append(roomCard(d.id, d.data(), i)));
}

function homeView() {
  reset(); document.title = '토크룸';
  app.append(el('h1', null, '주제를 정하고, 같이 이야기해요'), el('p', 'sub', '방을 만들어 링크를 보내면 의견이 실시간으로 쌓여요.'));
  if (user) {
    const f = el('div', 'new'), t = el('input');
    t.placeholder = '방 주제 (예: 올해 최고의 게임은?)'; t.maxLength = 60;
    const b = el('button', 'btn', '방 만들기');
    const lab = el('label', 'tog'), cb = el('input'), hint = el('small', 'togHint', ''); cb.type = 'checkbox';
    lab.append(cb, el('span', 'track'), el('span', null, '🔒 비공개 방'));
    cb.onchange = () => { hint.textContent = cb.checked ? '목록에 안 보이고, 링크를 받은 사람만 입장해요.' : ''; };
    b.onclick = async () => {
      const v = t.value.trim(); if (!v) return; b.disabled = true;
      try { const r = await addDoc(collection(db, 'rooms'), { title: v, ownerId: user.uid, ownerName: user.displayName || '익명', listed: !cb.checked, createdAt: serverTimestamp() }); location.hash = '#' + r.id; }
      catch (e) { b.disabled = false; alert('방을 만들지 못했어요. Firestore 보안 규칙을 확인해 주세요.'); }
    };
    f.append(t, b, lab, hint); app.append(f);
  } else app.append(el('div', 'hint', '로그인하면 방을 만들고 의견을 남길 수 있어요. 구경은 로그인 없이도 가능해요.'));

  const mineHead = el('h2', 'sec', '내 비공개 방'), mine = el('div', 'rooms');
  mineHead.hidden = true; mine.hidden = true; app.append(mineHead, mine);
  app.append(el('h2', 'sec', '공개 방'));
  const list = el('div', 'rooms'); app.append(list);

  unsubs.push(onSnapshot(query(collection(db, 'rooms'), where('listed', '==', true)), s => {
    const d = s.docs.slice().sort((a, b) => tm(b.data()) - tm(a.data()));
    fillRooms(list, d, '아직 공개 방이 없어요. 첫 방을 만들어보세요.');
  }, () => { list.textContent = '방 목록을 불러오지 못했어요.'; }));

  if (user) unsubs.push(onSnapshot(query(collection(db, 'rooms'), where('ownerId', '==', user.uid)), s => {
    const d = s.docs.filter(x => x.data().listed !== true).sort((a, b) => tm(b.data()) - tm(a.data()));
    mineHead.hidden = mine.hidden = !d.length; if (d.length) fillRooms(mine, d, '');
  }, () => {}));
}

function showQR(url, title) {
  if (typeof qrcode !== 'function') { alert('QR 코드를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'); return; }
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const n = q.getModuleCount(), m = 4, size = n + 2 * m; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', title + ' 입장 QR 코드');
  const bg = document.createElementNS(ns, 'rect'); bg.setAttribute('width', size); bg.setAttribute('height', size); bg.setAttribute('fill', '#fff');
  const path = document.createElementNS(ns, 'path'); path.setAttribute('d', d); path.setAttribute('fill', '#000'); path.setAttribute('shape-rendering', 'crispEdges');
  svg.append(bg, path);
  const ov = el('div', 'ov'), box = el('div', 'qrbox'), close = el('button', 'btn', '닫기');
  close.onclick = () => ov.remove(); ov.onclick = e => { if (e.target === ov) ov.remove(); };
  box.append(el('b', null, title), svg, el('small', null, url), close); ov.append(box); document.body.append(ov);
}
async function shareRoom(title, btn) {
  const url = location.href;
  if (navigator.share) { try { await navigator.share({ title, text: title + ' · 토크룸', url }); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(url); btn.textContent = '링크를 복사했어요'; } catch (e) { prompt('링크를 복사하세요', url); }
}

const loadImg = f => new Promise((ok, no) => { const u = URL.createObjectURL(f), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => no(new Error('이 사진 형식은 올릴 수 없어요. JPG나 PNG로 시도해 주세요.')); i.src = u; });
async function shrink(f, max, q) {
  const i = await loadImg(f), r = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas');
  c.width = Math.round(i.width * r); c.height = Math.round(i.height * r); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
}
const toData = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
async function cloudUpload(file, kind) {
  const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', CLOUDINARY.uploadPreset);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/${kind}/upload`, { method: 'POST', body: fd });
  const j = await r.json(); if (!r.ok || !j.secure_url) throw new Error('파일 업로드에 실패했어요. Cloudinary 설정을 확인해 주세요.');
  return j.secure_url;
}
async function uploadMedia(file) {
  if (file.type.startsWith('video/')) return { type: 'video', url: await cloudUpload(file, 'video') };
  if (cloudOn) return { type: 'image', url: await cloudUpload(await shrink(file, 1600, .85), 'image') };
  for (const [max, q] of [[900, .72], [700, .65], [500, .6]]) { const d = await toData(await shrink(file, max, q)); if (d.length < 700000) return { type: 'image', url: d }; }
  throw new Error('사진이 너무 커요. 더 작은 사진을 골라주세요.');
}
function lightbox(url) {
  const ov = el('div', 'ov lb'), i = el('img'); i.src = url; i.alt = '확대한 사진'; ov.append(i); ov.onclick = () => ov.remove(); document.body.append(ov);
}

function openCompose(id) {
  const ov = el('div', 'ov sheetov'), box = el('div', 'sheet');
  const head = el('div', 'sheethead'), x = el('button', 'x', '✕'); x.setAttribute('aria-label', '닫기'); x.onclick = () => ov.remove();
  head.append(el('b', null, '의견 쓰기'), x);
  const ta = el('textarea'); ta.placeholder = '의견을 남겨보세요'; ta.maxLength = 300;
  let file = null;
  const prev = el('div', 'preview'); prev.hidden = true;
  const pick = el('input'); pick.type = 'file'; pick.accept = 'image/*,video/*'; pick.hidden = true;
  const attach = el('button', 'pill', '📷 사진 · 동영상'); attach.onclick = () => pick.click();
  const rowa = el('div', 'rowa'); rowa.append(attach, pick);
  if (!cloudOn) rowa.append(el('small', null, '사진만 가능'));
  const clearFile = () => { file = null; pick.value = ''; prev.hidden = true; prev.textContent = ''; };
  pick.onchange = () => {
    const f = pick.files[0]; if (!f) return;
    const isV = f.type.startsWith('video/'), isI = f.type.startsWith('image/');
    if (!isV && !isI) { alert('사진이나 동영상만 올릴 수 있어요.'); clearFile(); return; }
    if (isV && !cloudOn) { alert('동영상 업로드는 아직 설정되지 않았어요. 사진은 올릴 수 있어요.'); clearFile(); return; }
    if (isV && f.size > 50 * 1024 * 1024) { alert('동영상은 50MB 이하만 올릴 수 있어요.'); clearFile(); return; }
    if (isI && f.size > 15 * 1024 * 1024) { alert('사진은 15MB 이하만 올릴 수 있어요.'); clearFile(); return; }
    file = f; prev.textContent = ''; prev.hidden = false;
    const m = el(isV ? 'video' : 'img'); m.src = URL.createObjectURL(f);
    if (isV) { m.muted = true; m.controls = true; m.playsInline = true; } else m.alt = '선택한 사진';
    const rm = el('button', 'x', '✕'); rm.setAttribute('aria-label', '첨부 삭제'); rm.onclick = clearFile;
    prev.append(m, rm);
  };
  const dots = el('div', 'dots');
  for (let i = 0; i < 5; i++) {
    const dd = el('button', 'dot' + (i === color ? ' on' : '')); dd.style.background = `var(--c${i})`; dd.setAttribute('aria-label', '카드 색상 ' + (i + 1));
    dd.onclick = () => { color = i; [...dots.children].forEach((y, j) => { if (j < 5) y.classList.toggle('on', j === i); }); }; dots.append(dd);
  }
  const send = el('button', 'btn', '올리기');
  send.onclick = async () => {
    const v = ta.value.trim(); if (!v && !file) return;
    send.disabled = true; send.textContent = '올리는 중…';
    try {
      const data = { text: v, color, uid: user.uid, name: user.displayName || '익명', photo: user.photoURL || '', likes: [], createdAt: serverTimestamp() };
      if (file) data.media = await uploadMedia(file);
      await addDoc(collection(db, 'rooms', id, 'posts'), data); ov.remove();
    } catch (e) { send.disabled = false; send.textContent = '올리기'; alert(e && e.code ? '올리지 못했어요. 잠시 후 다시 시도해 주세요.' : (e && e.message) || '올리지 못했어요.'); }
  };
  dots.append(send); box.append(head, ta, prev, rowa, dots); ov.append(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.body.append(ov); ta.focus();
}

function roomView(id) {
  reset();
  const back = el('button', 'link', '← 방 목록'); back.onclick = () => { location.hash = ''; };
  const h = el('h1', null, ''), sub = el('p', 'sub', '');
  app.append(back, h, sub);
  let room = null;
  const bar = el('div', 'bar');
  const sh = el('button', 'pill', '공유'), qr = el('button', 'pill', 'QR'), cp = el('button', 'pill', '링크 복사');
  sh.onclick = () => shareRoom(room ? room.title : '토크룸', sh);
  qr.onclick = () => showQR(location.href, room ? room.title : '토크룸');
  cp.onclick = async () => { try { await navigator.clipboard.writeText(location.href); cp.textContent = '복사했어요'; } catch (e) { prompt('링크를 복사하세요', location.href); } };
  bar.append(sh, qr, cp); app.append(bar);

  const fab = el('button', 'fab', '+'); fab.setAttribute('aria-label', '글쓰기');
  fab.onclick = () => { if (!user) { login(); return; } openCompose(id); };
  app.append(fab);
  const wall = el('div', 'wall'); app.append(wall);

  unsubs.push(onSnapshot(doc(db, 'rooms', id), s => {
    if (!s.exists()) { room = null; h.textContent = '없는 방이에요'; sub.textContent = '삭제됐거나 주소가 잘못됐어요.'; return; }
    room = s.data(); h.textContent = (room.listed === true ? '' : '🔒 ') + room.title;
    sub.textContent = (room.listed === true ? '' : '비공개 방 · 링크를 아는 사람만 들어올 수 있어요 · ') + '만든 사람 ' + (room.ownerName || '익명');
    document.title = room.title + ' · 토크룸';
    if (user && user.uid === room.ownerId && !bar.querySelector('.del')) {
      const d = el('button', 'pill del', '방 삭제');
      d.onclick = async () => {
        if (!confirm('이 방과 모든 의견을 삭제할까요?')) return;
        try {
          const ps = await getDocs(collection(db, 'rooms', id, 'posts')); await Promise.all(ps.docs.map(p => deleteDoc(p.ref)));
          await deleteDoc(doc(db, 'rooms', id)); location.hash = '';
        } catch (e) { alert('삭제하지 못했어요.'); }
      };
      bar.append(d);
    }
  }));
  unsubs.push(onSnapshot(query(collection(db, 'rooms', id, 'posts'), orderBy('createdAt', 'desc')), s => {
    wall.textContent = '';
    if (s.empty) { wall.style.columns = 'auto'; wall.append(el('div', 'empty', '첫 의견을 남겨보세요.')); return; }
    wall.style.columns = '';
    s.docs.forEach(d => {
      const p = d.data(), n = el('div', 'note'); n.style.background = `var(--c${(p.color | 0) % 5})`;
      const mu = p.media && p.media.url;
      if (mu && /^(https:\/\/|data:image\/)/.test(mu)) {
        let md;
        if (p.media.type === 'video') { md = el('video'); md.controls = true; md.playsInline = true; md.preload = 'metadata'; }
        else { md = el('img'); md.loading = 'lazy'; md.alt = '첨부 사진'; md.onclick = () => lightbox(mu); }
        md.src = mu; n.append(md);
      }
      if (p.text) n.append(el('p', null, p.text));
      const m = el('div', 'meta');
      if (p.photo) { const i = el('img'); i.src = p.photo; i.alt = ''; i.referrerPolicy = 'no-referrer'; m.append(i); }
      m.append(el('span', 'who', p.name || '익명'));
      const likes = p.likes || [], liked = user && likes.includes(user.uid);
      const lb = el('button', 'like' + (liked ? ' on' : ''), '♥ ' + likes.length);
      lb.setAttribute('aria-label', '좋아요');
      lb.onclick = () => { if (!user) return login(); updateDoc(d.ref, { likes: liked ? arrayRemove(user.uid) : arrayUnion(user.uid) }); };
      m.append(lb);
      if (user && (user.uid === p.uid || (room && user.uid === room.ownerId))) {
        const x = el('button', 'x', '✕'); x.setAttribute('aria-label', '삭제');
        x.onclick = () => { if (confirm('이 의견을 삭제할까요?')) deleteDoc(d.ref); }; m.append(x);
      }
      n.append(m); wall.append(n);
    });
  }, () => { wall.textContent = '의견을 불러오지 못했어요.'; }));
}
</script>
</body>
</html>
